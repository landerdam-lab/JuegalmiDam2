# Versiones fijadas al crear el proyecto (ADR-031). Cada librería nueva se añade aquí
# y en la tabla de 06-Android/Librerias Android.md de la bóveda.
[versions]
agp = "9.3.3"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
material = "1.14.0"
activity = "1.13.0"
constraintlayout = "2.2.2"
coreSplashscreen = "1.2.0"
recyclerview = "1.4.0"
viewpager2 = "1.1.0"
volley = "1.2.1"
retrofit = "3.0.0"
glide = "5.0.9"
playServicesLocation = "21.4.0"
osmdroid = "6.1.20"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
# Material 3: el tema «Cartucho» (Theme.JuegAlmi) hereda de Theme.Material3
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
# EdgeToEdge.enable(): la app se dibuja detrás de las barras del sistema
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
# Splash de PT-01 (Theme.JuegAlmi.Splash)
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
# Listas de productos, pedidos… (RecyclerView + adaptadores propios)
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
# Pestañas deslizables (TabLayout + ViewPager2)
viewpager2 = { group = "androidx.viewpager2", name = "viewpager2", version.ref = "viewpager2" }
# HTTP asíncrono: lecturas y login (obligatoria en el enunciado)
volley = { group = "com.android.volley", name = "volley", version.ref = "volley" }
# 2.ª librería HTTP: escrituras (registro, pedidos, reparaciones). Gson convierte el JSON en objetos
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
# Imágenes con caché, placeholder y error, cargadas en segundo plano
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
# GPS: última ubicación conocida para las cabeceras X-Latitud / X-Longitud (ADR-014)
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
# Mapa de la tienda (PT-26) con OpenStreetMap, sin clave de API (P-23 → ADR-037)
osmdroid = { group = "org.osmdroid", name = "osmdroid-android", version.ref = "osmdroid" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
