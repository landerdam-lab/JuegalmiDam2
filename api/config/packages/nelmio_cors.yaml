# CORS: solo los navegadores lo aplican. Lo necesitan la web (ng serve), Ionic en el navegador
# (ionic serve) y la APK de Ionic (Capacitor sirve la app desde http(s)://localhost).
# Los orígenes permitidos se configuran con CORS_ALLOW_ORIGIN (.env / .env.local). Nunca '*'.
nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization', 'X-Latitud', 'X-Longitud']
        max_age: 3600
    paths:
        '^/api/': null
